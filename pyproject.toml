[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safix"
version = "0.1.0"
description = "SAFIX — Static Analyzer for FIX: a security scanner for the FIX trading protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SAFIX" }]
keywords = ["fix", "fix-protocol", "security", "scanner", "quickfix", "trading", "sast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "simplefix>=1.0",       # dev-only conformance oracle; NOT on the runtime parse path
]
all = ["safix[web,dev]"]

[project.scripts]
safix = "safix.cli:main"

[project.urls]
Homepage = "https://example.invalid/safix"

[tool.hatch.build.targets.wheel]
packages = ["src/safix"]

[tool.hatch.build.targets.wheel.force-include]
"src/safix/data/dictionaries" = "safix/data/dictionaries"
"src/safix/rules/builtin" = "safix/rules/builtin"
"src/safix/web/static" = "safix/web/static"
"src/safix/data/rule_catalog.json" = "safix/data/rule_catalog.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
